name: MercatoIQ CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  pipeline-tests:
    name: Python Medallion Pipeline Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r pipeline/requirements.txt

      - name: Run pipeline unit tests
        run: python -m unittest discover -s pipeline -p "test_*.py" -v

  frontend-checks:
    name: Frontend Typecheck, Build & Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build production bundle
        working-directory: frontend
        run: npm run typecheck && npm run build

      - name: Run Vitest unit suite
        working-directory: frontend
        run: npx vitest run

  backend-checks:
    name: Backend NestJS Build & Jest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build NestJS API
        working-directory: backend
        run: npm run build

      - name: Run Jest test suite
        working-directory: backend
        run: npm test
